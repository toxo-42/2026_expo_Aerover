# .streamlit/config.toml
# dashboard.py 의 CSS 변수(37~48줄)와 색을 맞춘 테마.
# 이 파일이 없으면 체크박스가 빨간색, 파일 업로더가 흰색으로 나와 다크 테마와 충돌한다.

[theme]
base = "dark"
primaryColor = "#38dcf0"              # --cyan
backgroundColor = "#0a0d12"           # --bg
secondaryBackgroundColor = "#131922"  # --panel
textColor = "#eaf1f8"                 # --text

[server]
headless = true          # 실행 시 브라우저 자동 실행 안 함
fileWatcherType = "auto"

[browser]
gatherUsageStats = false # 사용 통계 전송 끔 (오프라인 시연 시 불필요한 외부 요청 제거)
